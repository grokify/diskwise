site_name: DiskWise
site_description: Know your disk. Use it wisely. A macOS storage-intelligence tool that finds what is using space and what can be reclaimed.
site_url: https://grokify.github.io/diskwise/
repo_url: https://github.com/grokify/diskwise
repo_name: grokify/diskwise

theme:
  name: material
  palette:
    - scheme: default
      primary: blue grey
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: blue grey
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - User Guide:
      - Installation: guides/installation.md
      - Quick Start: guides/quickstart.md
      - How DiskWise Thinks: guides/concepts.md
      - Scanning: guides/scanning.md
      - Exploring Usage: guides/exploring.md
      - Finding Reclaimable Space: guides/reclaiming.md
      - Archives and Extracted Copies: guides/archive-pairs.md
      - Checking Free Space for an Upgrade: guides/upgrade-readiness.md
      - Reports, Review Lists and Sharing: guides/sharing.md
      - Troubleshooting: guides/troubleshooting.md
  - Reference:
      - CLI Reference: guides/cli-reference.md
      - JSON Output: guides/json-output.md
      - Known Locations: guides/known-locations.md
  - Specifications:
      - Product Requirements: specs/PRD.md
      - Technical Requirements: specs/TRD.md
      - Plan: specs/PLAN.md
      - Roadmap: specs/ROADMAP.md
  - Releases:
      - v0.1.0: releases/v0.1.0.md
