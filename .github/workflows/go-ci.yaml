name: Go CI
permissions:
  contents: read
on:
  push:
    branches:
      - main
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/go-ci.yaml'
  pull_request:
    branches:
      - main
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/go-ci.yaml'
  workflow_dispatch:

jobs:
  ci:
    uses: grokify/.github/.github/workflows/go-ci.yaml@main
    # diskwise's platform/ package uses Darwin-only syscalls (st_blocks
    # allocated size, volume stats) with no Linux/Windows fallback, so
    # it only builds and tests on macOS.
    with:
      platforms: '["macos-latest"]'
